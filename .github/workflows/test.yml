name: Test Suite & Code Quality

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Code Analysis & Linting (Ruff)
        run: |
          ruff check src tests scripts

      - name: Execute Full Test Suite (Pytest)
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          RATEFORTRESS_BACKEND: redis_async
          USE_FAKE_REDIS: "true"
          PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
        run: |
          mkdir -p /tmp/prometheus_multiproc
          pytest -v --tb=short
