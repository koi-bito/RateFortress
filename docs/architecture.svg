<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="boxGradPrimary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGradAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    
    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="45" text-anchor="middle" font-size="24" font-weight="800" fill="url(#headerGrad)" letter-spacing="1">RATEFORTRESS SYSTEM ARCHITECTURE</text>
  <text x="550" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">Distributed Production Rate Limiting Engine • Multi-Tier Middleware • Observability &amp; Cloud Topology</text>

  <!-- ==================== 1. INGRESS LAYER ==================== -->
  <g transform="translate(60, 110)">
    <rect width="280" height="90" rx="10" fill="url(#boxGradPrimary)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="140" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">1. Client Ingress Layer</text>
    <text x="140" y="50" text-anchor="middle" font-size="11" fill="#94a3b8">Public Web, Mobile Apps, Microservices</text>
    <text x="140" y="68" text-anchor="middle" font-size="10" fill="#38bdf8">Headers: X-API-Key, X-Forwarded-For, IP</text>
  </g>

  <!-- Arrow: Ingress to Gateway -->
  <line x1="340" y1="155" x2="420" y2="155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="145" text-anchor="middle" font-size="10" fill="#94a3b8">HTTP Req</text>

  <!-- ==================== 2. FASTAPI GATEWAY & MIDDLEWARE ==================== -->
  <g transform="translate(430, 100)">
    <rect width="610" height="230" rx="12" fill="url(#boxGradAccent)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="30" font-size="15" font-weight="700" fill="#a5b4fc">2. FastAPI Gateway &amp; RateLimit Middleware</text>
    
    <!-- Sub-module: Identity & Trie -->
    <g transform="translate(25, 50)">
      <rect width="265" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="132" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Endpoint Trie &amp; Identity Resolver</text>
      <text x="132" y="42" text-anchor="middle" font-size="10" fill="#94a3b8">Matches /api/* hierarchical route rules</text>
      <text x="132" y="58" text-anchor="middle" font-size="10" fill="#fbbf24">Resolves Tier: Free (1x), Paid (10x), Ent (50x)</text>
    </g>

    <!-- Sub-module: Circuit Breaker -->
    <g transform="translate(315, 50)">
      <rect width="265" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="132" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">CircuitBreaker (Fail-Open)</text>
      <text x="132" y="42" text-anchor="middle" font-size="10" fill="#94a3b8">Monitors Redis connection health</text>
      <text x="132" y="58" text-anchor="middle" font-size="10" fill="#34d399">Trips OPEN on failures → Bypasses limiter</text>
    </g>

    <!-- Sub-module: Telemetry Hooks -->
    <g transform="translate(25, 140)">
      <rect width="555" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="277" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Telemetry Instrumentation Hooks</text>
      <text x="277" y="44" text-anchor="middle" font-size="11" fill="#94a3b8">OpenTelemetry Spans • Active Requests Gauge • Decision Latency Histogram (µs)</text>
      <text x="277" y="58" text-anchor="middle" font-size="10" fill="#38bdf8">Attaches Headers: X-RateLimit-Limit, Remaining, Reset, Retry-After</text>
    </g>
  </g>

  <!-- Arrow: Gateway to Algorithms -->
  <line x1="735" y1="330" x2="735" y2="390" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="365" font-size="10" fill="#94a3b8">Execute Limiter</text>

  <!-- ==================== 3. RATE LIMITING ALGORITHM ENGINE ==================== -->
  <g transform="translate(60, 395)">
    <rect width="980" height="155" rx="12" fill="url(#boxGradPrimary)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="30" y="28" font-size="15" font-weight="700" fill="#38bdf8">3. Pluggable Algorithm Engine (Sync &amp; Async)</text>
    <text x="30" y="46" font-size="11" fill="#94a3b8">Evaluates request allowance in microsecond time complexity based on endpoint configuration</text>

    <!-- 5 Algorithm Boxes -->
    <g transform="translate(30, 60)">
      <!-- Fixed Window -->
      <g transform="translate(0, 0)">
        <rect width="170" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Fixed Window</text>
        <text x="85" y="40" text-anchor="middle" font-size="10" fill="#94a3b8">O(1) Counter • Fast</text>
        <text x="85" y="56" text-anchor="middle" font-size="9" fill="#f87171">Boundary Burst (2x)</text>
      </g>
      <!-- Sliding Window Log -->
      <g transform="translate(185, 0)">
        <rect width="170" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Sliding Window Log</text>
        <text x="85" y="40" text-anchor="middle" font-size="10" fill="#94a3b8">ZSET Timestamps</text>
        <text x="85" y="56" text-anchor="middle" font-size="9" fill="#34d399">100% Exact • O(N) RAM</text>
      </g>
      <!-- Sliding Window Counter -->
      <g transform="translate(370, 0)">
        <rect width="180" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="90" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Sliding Window Counter</text>
        <text x="90" y="40" text-anchor="middle" font-size="10" fill="#94a3b8">Weighted Rolling Math</text>
        <text x="90" y="56" text-anchor="middle" font-size="9" fill="#38bdf8">O(1) RAM • Production Pick</text>
      </g>
      <!-- Token Bucket -->
      <g transform="translate(565, 0)">
        <rect width="170" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Token Bucket</text>
        <text x="85" y="40" text-anchor="middle" font-size="10" fill="#94a3b8">Capacity + Refill Rate</text>
        <text x="85" y="56" text-anchor="middle" font-size="9" fill="#fbbf24">Accommodates Bursts</text>
      </g>
      <!-- Leaky Bucket -->
      <g transform="translate(750, 0)">
        <rect width="170" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Leaky Bucket</text>
        <text x="85" y="40" text-anchor="middle" font-size="10" fill="#94a3b8">Constant Outflow</text>
        <text x="85" y="56" text-anchor="middle" font-size="9" fill="#a78bfa">Protects Downstream</text>
      </g>
    </g>
  </g>

  <!-- Arrow: Algorithms to Redis -->
  <line x1="550" y1="550" x2="550" y2="605" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="582" font-size="10" fill="#94a3b8">Atomic EVALSHA</text>

  <!-- ==================== 4. REDIS STORAGE & ATOMICITY ==================== -->
  <g transform="translate(60, 610)">
    <rect width="520" height="185" rx="12" fill="url(#redisGrad)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="28" font-size="15" font-weight="700" fill="#fca5a5">4. Redis 7 Distributed Storage &amp; Lua Scripts</text>
    <text x="25" y="46" font-size="11" fill="#fecaca">Zero-race condition atomicity across multi-worker &amp; distributed instances</text>

    <!-- Lua scripts list -->
    <g transform="translate(25, 60)">
      <rect width="470" height="105" rx="8" fill="#1e1b1b" stroke="#7f1d1d" stroke-width="1"/>
      <text x="20" y="24" font-size="11" font-family="monospace" fill="#38bdf8">• redis_sliding_window_log.lua (ZREMRANGEBYSCORE + ZCARD + ZADD)</text>
      <text x="20" y="44" font-size="11" font-family="monospace" fill="#38bdf8">• redis_sliding_window_counter.lua (Atomic GET + INCR + EXPIRE)</text>
      <text x="20" y="64" font-size="11" font-family="monospace" fill="#38bdf8">• redis_token_bucket.lua (Refill Math + Token Consumption)</text>
      <text x="20" y="84" font-size="11" font-family="monospace" fill="#38bdf8">• redis_leaky_bucket.lua (Leak Drain Math + Enqueue Buffer)</text>
    </g>
  </g>

  <!-- ==================== 5. OBSERVABILITY STACK ==================== -->
  <g transform="translate(610, 610)">
    <rect width="430" height="185" rx="12" fill="url(#boxGradPrimary)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="28" font-size="15" font-weight="700" fill="#6ee7b7">5. Unified Observability Stack</text>
    <text x="25" y="46" font-size="11" fill="#94a3b8">Real-time metrics, log indexing &amp; SLA alerting</text>

    <g transform="translate(25, 60)">
      <!-- Prometheus Box -->
      <rect width="180" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#f8fafc">Prometheus</text>
      <text x="90" y="36" text-anchor="middle" font-size="9" fill="#94a3b8">Scrapes /metrics (5s)</text>

      <!-- Grafana Box -->
      <g transform="translate(200, 0)">
        <rect width="180" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#f8fafc">Grafana Dashboards</text>
        <text x="90" y="36" text-anchor="middle" font-size="9" fill="#38bdf8">Live Throttling &amp; Latency</text>
      </g>

      <!-- Loki & Promtail -->
      <g transform="translate(0, 56)">
        <rect width="180" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#f8fafc">Promtail + Loki</text>
        <text x="90" y="36" text-anchor="middle" font-size="9" fill="#a78bfa">Structured JSON Logs</text>
      </g>

      <!-- Alertmanager -->
      <g transform="translate(200, 56)">
        <rect width="180" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#f8fafc">SLA Alert Rules</text>
        <text x="90" y="36" text-anchor="middle" font-size="9" fill="#f87171">Paid Throttling Spikes</text>
      </g>
    </g>
  </g>

  <!-- Return Flow Paths -->
  <!-- 200 OK Return -->
  <path d="M 430, 140 C 250, 140 180, 240 180, 310" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <rect x="110" y="240" width="140" height="30" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="180" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#34d399">HTTP 200 OK + Limits</text>

  <!-- 429 Throttled Return -->
  <path d="M 430, 170 C 280, 170 230, 290 230, 340" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <rect x="160" y="330" width="140" height="30" rx="4" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
  <text x="230" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#f87171">HTTP 429 + Retry-After</text>

</svg>

