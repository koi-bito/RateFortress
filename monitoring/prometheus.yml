# Prometheus Scrape Configuration for RateFortress Gateway (Week 10)
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "ratefortress"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["host.docker.internal:8000", "127.0.0.1:8000"]
        labels:
          app: "ratefortress"
          service: "api-gateway"
          env: "production"

