# Promtail Log Shipper Configuration for RateFortress (Week 11)
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ratefortress-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: ratefortress
          app: ratefortress
          env: production
          __path__: /var/log/ratefortress/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            client_id: client_id
            tier: tier
            algorithm: algorithm
            endpoint: endpoint
            status_code: status_code
            latency_ms: latency_ms

      - labels:
          level:
          tier:
          algorithm:
          status_code:

      - timestamp:
          source: timestamp
          format: RFC3339

